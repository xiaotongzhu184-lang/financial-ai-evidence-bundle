name: Local-public-fixture QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements.lock
      - run: bandit -r src scripts -ll
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_tests.py
      - run: yk-evidence contract-run --output runs --run-id ci-seed42 --seed 42
      - run: yk-evidence verify runs/ci-seed42
      - run: yk-evidence research-smoke --output runs --run-id ci-research --seed 42 --load-rows 10000
      - run: yk-evidence verify runs/ci-research
      - run: yk-evidence algorithm-smoke --output runs --run-id ci-algorithm --seed 42 --load-rows 10000
      - run: yk-evidence verify runs/ci-algorithm
      - run: python scripts/engineer_acceptance.py --mode algorithm --output runs/algorithm-acceptance
      - run: python scripts/project_acceptance.py --output runs/project-acceptance
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run = Path('runs/ci-seed42')
          manifest = json.loads((run / 'bundle_manifest.json').read_text())
          metadata = json.loads((run / 'run_metadata.json').read_text())
          gate = json.loads((run / 'release_gate.json').read_text())
          required = set(manifest['required_artifacts'])
          assert required <= set(manifest['artifacts'])
          assert 'decision_impact.json' in required
          assert metadata['code_revision']
          assert gate['status'] == 'blocked'
          PY
      - run: python -m pip wheel . --no-deps -w dist
      - run: |
          python -m venv /tmp/yk-wheel-qa
          /tmp/yk-wheel-qa/bin/python -m pip install -r requirements.lock
          /tmp/yk-wheel-qa/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/yk-wheel-qa/bin/yk-evidence contract-run --output /tmp/yk-wheel-runs --run-id wheel-ci --seed 42
          /tmp/yk-wheel-qa/bin/yk-evidence verify /tmp/yk-wheel-runs/wheel-ci
          /tmp/yk-wheel-qa/bin/yk-evidence research-smoke --output /tmp/yk-wheel-runs --run-id wheel-research --load-rows 10000
          /tmp/yk-wheel-qa/bin/yk-evidence verify /tmp/yk-wheel-runs/wheel-research
          /tmp/yk-wheel-qa/bin/yk-evidence algorithm-smoke --output /tmp/yk-wheel-runs --run-id wheel-algorithm --load-rows 10000
          /tmp/yk-wheel-qa/bin/yk-evidence verify /tmp/yk-wheel-runs/wheel-algorithm
          /tmp/yk-wheel-qa/bin/yk-evidence project-smoke --output /tmp/yk-wheel-runs --run-id wheel-project --load-rows 10000
          /tmp/yk-wheel-qa/bin/yk-evidence verify /tmp/yk-wheel-runs/wheel-project
          /tmp/yk-wheel-qa/bin/python -c "import json, pathlib; p=pathlib.Path('/tmp/yk-wheel-runs/wheel-ci'); r=json.loads((p/'run_record.json').read_text()); assert r['code_revision'] == 'source-sha256:' + r['code_sha256']"
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_tests.py
      - run: python scripts/engineer_acceptance.py --mode algorithm --output runs/windows-acceptance
      - run: python scripts/project_acceptance.py --output runs/windows-project-acceptance
      - run: python scripts/audit_resilience_results.py runs/windows-acceptance/acceptance
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/run_tests.py
      - run: python scripts/engineer_acceptance.py --mode algorithm --output runs/macos-acceptance
      - run: python scripts/project_acceptance.py --output runs/macos-project-acceptance
      - run: python scripts/audit_resilience_results.py runs/macos-acceptance/acceptance
